name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    env:
      CLAUDE_CONFIG_DIR: /tmp/ailine-claude-config
      DISABLE_TELEMETRY: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Claude Code
        run: |
          installer_dir=$(mktemp --directory "$RUNNER_TEMP/claude-installer.XXXXXX")
          installer="$installer_dir/install.sh"
          curl --fail --silent --show-error --location https://claude.ai/install.sh --output "$installer"
          printf '%s  %s\n' '2c5506d110560bf618bbe88f678f2c2a0047c86a9c6585fc84976120b1de0b44' "$installer" | sha256sum --check
          bash "$installer" 2.1.327
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate marketplace and plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict --profile directory ./plugin

      - name: Prepare checksum-pinned Bun compiler
        run: |
          runtimes="$RUNNER_TEMP/bun-runtimes"
          python3 -I tools/prepare_bun.py "$runtimes" --native-only
          echo "$runtimes" >> "$GITHUB_PATH"

      - name: Run plugin tests
        run: bun run test:host

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      CLAUDE_CONFIG_DIR: /tmp/ailine-ts-claude-config
      DISABLE_TELEMETRY: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare checksum-pinned Bun runtimes
        run: |
          runtimes="$RUNNER_TEMP/bun-runtimes"
          python3 -I tools/prepare_bun.py "$runtimes"
          echo "$runtimes" >> "$GITHUB_PATH"
          echo "BUN_RUNTIME_DIR=$runtimes" >> "$GITHUB_ENV"

      - name: Install reviewed dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.20.2
          install-only: true

      - name: Check types, lint, portable tests and standalone executable
        run: |
          bun run typecheck
          bun run lint
          bun run test:core
          bun run test:cli
          bun run test:build

      - name: Rehearse all release artifacts without publishing
        run: goreleaser release --snapshot --skip=publish

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - plugin
      - typescript
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Prepare checksum-pinned Bun runtimes
        run: |
          runtimes="$RUNNER_TEMP/bun-runtimes"
          python3 -I tools/prepare_bun.py "$runtimes"
          echo "$runtimes" >> "$GITHUB_PATH"
          echo "BUN_RUNTIME_DIR=$runtimes" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # lexfrei/apt only rebuilds when told to, so a release that skips this
      # never reaches the apt repository.
      - name: Notify the apt repository
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: gh api --method POST repos/lexfrei/apt/dispatches --field event_type=release
