version: 2

builds:
  - main: ./cmd/claudeline
    binary: claudeline
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - formats: [deb]
    # GoReleaser's default puts the OS in the name, which no Debian tool
    # expects: the archive is what carries a platform, a .deb carries an
    # architecture.
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: lexfrei
    homepage: "https://github.com/lexfrei/claudeline"
    maintainer: Aleksei Sviridkin <f@lex.la>
    description: Real-time statusline for Claude Code
    license: BSD-3-Clause
    section: utils
    contents:
      - src: LICENSE
        dst: /usr/share/doc/claudeline/copyright

brews:
  - repository:
      owner: lexfrei
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/lexfrei/claudeline"
    description: "Real-time statusline for Claude Code"
    license: "BSD-3-Clause"
    install: |
      bin.install "claudeline"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^style:"
