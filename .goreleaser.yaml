version: 2

project_name: ailine

builds:
  - main: ./cmd/ailine
    binary: ailine
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - formats: [deb]
    # GoReleaser's default puts the OS in the name, which no Debian tool
    # expects: the archive is what carries a platform, a .deb carries an
    # architecture.
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: lexfrei
    homepage: "https://github.com/lexfrei/ailine"
    maintainer: Aleksei Sviridkin <f@lex.la>
    description: Real-time statusline for Claude Code
    license: BSD-3-Clause
    section: utils
    contents:
      - src: LICENSE
        dst: /usr/share/doc/ailine/copyright
      # Owned here rather than by the transitional package: apt marks that one
      # auto-installed, so autoremove would take the old command name with it.
      - src: ailine
        dst: /usr/bin/claudeline
        type: symlink
    # claudeline 1.11.0 shipped the symlink itself.
    replaces:
      - claudeline (<< 1.11.1)
    deb:
      breaks:
        - claudeline (<< 1.11.1)

  # The project was called claudeline. This empty package upgrades the old
  # one in place and pulls ailine in.
  - id: claudeline-transitional
    package_name: claudeline
    meta: true
    formats: [deb]
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: lexfrei
    homepage: "https://github.com/lexfrei/ailine"
    maintainer: Aleksei Sviridkin <f@lex.la>
    description: Transitional package, claudeline is now ailine
    license: BSD-3-Clause
    section: oldlibs
    dependencies:
      - ailine

brews:
  - name: ailine
    repository:
      owner: lexfrei
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/lexfrei/ailine"
    description: "Real-time statusline for Claude Code"
    license: "BSD-3-Clause"
    install: |
      bin.install "ailine"
      bin.install_symlink "ailine" => "claudeline"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^style:"
